services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echotwin}
      POSTGRES_USER: ${POSTGRES_USER:-echotwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echotwin} -d ${POSTGRES_DB:-echotwin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "${MQTT_PORT_FORWARD:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      MQTT_BROKER_HOST: mosquitto
    ports:
      - "${API_PORT_FORWARD:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  maintenance-api:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.maintenance.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      MAINTENANCE_NOTIFICATION_MODE: ${MAINTENANCE_NOTIFICATION_MODE:-dry_run}
    ports:
      - "${MAINTENANCE_API_PORT_FORWARD:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  maintenance-worker:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.maintenance.worker"]
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      MAINTENANCE_NOTIFICATION_MODE: ${MAINTENANCE_NOTIFICATION_MODE:-dry_run}
    depends_on:
      maintenance-api:
        condition: service_healthy

volumes:
  postgres_data:
